<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure spacing editor - live Host</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f7f9; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #shell { width: 400px; height: 100%; margin: 0 auto; background: #fff; border-left: 1px solid #e3e6ea; border-right: 1px solid #e3e6ea; display: flex; flex-direction: column; }
  #head { padding: 10px 12px 8px; font-size: 12px; font-weight: 600; color: #1f2328; border-bottom: 1px solid #e3e6ea; }
  #root { flex: 1 1 auto; min-height: 0; }
</style>
</head>
<body>
<div id="shell">
  <div id="head">Right sidebar &middot; Figure spacing &middot; live Host</div>
  <div id="root"></div>
</div>
<script src="node_modules/react/umd/react.development.js"></script>
<script src="node_modules/react-dom/umd/react-dom.development.js"></script>
<script>
  window.__log = []
  const _fetch = window.fetch.bind(window)
  window.fetch = (...args) => {
    if (String(args[0]).includes('/quick')) {
      return Promise.resolve(new Response(JSON.stringify({ error: 'quick disabled' }), {
        status: 500,
        headers: { 'content-type': 'application/json' },
      }))
    }
    const started = performance.now()
    return _fetch(...args).then(response => {
      window.__log.push(String(args[0]).replace('http://127.0.0.1:8829', '') + ' ' + response.status + ' ' + Math.round(performance.now() - started) + 'ms')
      return response
    })
  }
</script>
<script>
  let factory = null
  window.__ModuleLoader__ = { load({ id, factory: make }) { factory = make } }
</script>
<script src="../../plugins/fig-layout/client.js"></script>
<script>
  const T = {
    'figure.label': 'Plate', 'figure.fig1': 'Figure 1 \u00b7 composition', 'figure.fig2': 'Figure 2 \u00b7 overlap',
    'status.saved': 'Saved', 'status.edited': 'edited', 'status.applied': 'Applied', 'status.rendered': 'Rendered',
    'status.preview': 'Live preview', 'status.rendering': 'Rendering',
    'meta.size': 'Size', 'meta.print': 'Print', 'meta.printValue': '22.1 cm high \u2192 {width} cm',
    'meta.margins': 'Margins', 'meta.unit': 'px', 'meta.open': 'Open PNG',
    'group.unit': 'canvas units, 4-unit grid',
    'action.apply': 'Apply', 'action.render': 'Re-render', 'action.reset': 'Reset', 'action.all': 'All gaps',
    'hint.pick': 'Click a gap in the plate to pick it, then drag its slider',
    'kind.title-gap': 'Space under the family title', 'kind.head-gap': 'Space under the family rule',
    'kind.panel-gap': 'Checkpoint gaps', 'kind.prompt-gap': 'Prompt-group gaps', 'kind.lens-gap': 'Lens gaps',
    'kind.row-gap': 'Row gaps', 'kind.family-gap': 'Space between families', 'kind.legend-gap': 'Space before the legend',
    'kind.page-margin': 'Page edge', 'kind.places': 'places', 'kind.tokens': 'tokens', 'kind.token': 'token',
    'status.loading': 'Reading plate', 'status.offline': 'Service on 8829 is not running', 'error.prefix': 'Failed',
  }
  const plugin = factory(name => {
    if (name === 'react') return window.React
    throw new Error('unexpected require: ' + name)
  })
  const registrations = []
  const ctx = {
    locale: { bind: () => key => T[key] || key, register: () => () => {} },
    slots: {
      inject: (name, make) => make(),
      register: (options, component) => { registrations.push({ options, component }); return () => {} },
    },
    sidebarRightTabs: { register: () => () => {} },
    sidebarRight: {
      mounted: { getSnapshot: () => 'session-preview', subscribe: () => () => {} },
      openTabs: { getSnapshot: () => [] },
      openTab: () => {},
      closeIn: () => {},
    },
    effect: fn => { const dispose = fn(); if (typeof dispose === 'function') dispose() },
  }
  plugin.apply(ctx)
  const body = registrations.find(entry => entry.options && entry.options.name === 'sidebar.right.pane.tab')
  const root = window.ReactDOM.createRoot(document.getElementById('root'))
  root.render(window.React.createElement(body.component, { t: key => T[key] || key }))

  setTimeout(() => {
    const range = document.querySelector('input[aria-label="MGAP"]')
    if (range) {
      const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set
      setter.call(range, '72')
      range.dispatchEvent(new window.Event('input', { bubbles: true }))
    }
  }, 2000)

  setTimeout(() => {
    const value = document.querySelector('input[aria-label="MGAP value"]')
    const svg = document.querySelector('svg')
    const img = document.querySelector('img[alt]')
    document.title = JSON.stringify({ svg: !!svg, img: !!img, zones: document.querySelectorAll('.fig-zone').length, mgap: value && value.value })
  }, 4500)
</script>
</body>
</html>
